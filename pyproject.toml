[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragion"
version = "0.0.5"
description = "Python-first Android application framework foundation"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Pragatheeswaran" },
]
keywords = ["android", "framework", "python", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
pragion = "pragion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/pragion/frontend/pages" = ["frontend/pages/*.html"]
"share/pragion/frontend/styles" = ["frontend/styles/*.css"]
"share/pragion/frontend/scripts" = ["frontend/scripts/*.js"]
"share/pragion/frontend/components" = ["frontend/components/README.md"]
"share/pragion/frontend/assets" = ["frontend/assets/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
