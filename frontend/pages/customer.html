<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer</title><link rel="stylesheet" href="../styles/pragion.css"></head><body><main class="pragion-shell pragion-page-header"><span class="pragion-page-header__eyebrow">Backend / JSON boundary</span><h1>Customer</h1><section class="pragion-card" id="customer-details" aria-live="polite">Loading customer...</section></main><script src="../scripts/core.js"></script><script src="../scripts/api.js"></script><script>Pragion.api.getCustomer(1).then((customer) => { const details = document.getElementById("customer-details"); details.textContent = `${customer.name} — ${customer.balance}`; }).catch(() => { document.getElementById("customer-details").textContent = "Unable to load customer."; });</script></body></html>
